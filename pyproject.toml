[project]
name = "bambu-mcp"
version = "0.1.0"
description = "MCP connector for the Bambu Lab A1 mini in LAN mode: status, print control, slicing with automatically chosen settings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "paho-mqtt>=2.0,<3",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bambu-mcp = "bambu_mcp.server:main"
bambu-find = "bambu_mcp.discovery:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambu_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
