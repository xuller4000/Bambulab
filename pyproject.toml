[project]
name = "bambu-mcp"
version = "0.1.0"
description = "MCP connector for Bambu Lab printers (A1 mini) in LAN mode: status, file upload, print start, live tuning, slicing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "paho-mqtt>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bambu-mcp = "bambu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambu_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
